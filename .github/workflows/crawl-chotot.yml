name: Crawl Chotot Listings

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run crawl:chotot

      - name: Install Chrome (for batdongsan crawl)
        run: |
          which google-chrome || (sudo apt-get update -q && sudo apt-get install -y -q google-chrome-stable)

      - run: npm run crawl:batdongsan

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/danang-listings.json \
                  src/data/damsen-listings.json
          git diff --cached --quiet || git commit -m "chore: update chotot listings"
          git push

      - name: Trigger deploy
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'master',
            })
