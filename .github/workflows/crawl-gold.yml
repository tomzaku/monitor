name: Crawl Market Data

on:
  schedule:
    - cron: '0 0 * * *'  # 7:00 AM ICT (UTC+7) = 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run crawl:gold

      - run: npm run crawl:yahoo

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/gold-historical.json \
                  src/data/bitcoin-historical.json \
                  src/data/etf-E1VFVN30-historical.json \
                  src/data/etf-FUESSV30-historical.json \
                  src/data/etf-FUEVFVND-historical.json
          git diff --cached --quiet || git commit -m "chore: update market data"
          git push
